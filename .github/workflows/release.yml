name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting & syntax
        run: cargo check --verbose

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Package Release Assets
        run: |
          mkdir -p release_package
          cp target/release/bobby release_package/
          cp bobby.desktop release_package/
          cp README.md release_package/
          cp LICENSE.md release_package/ 2>/dev/null || true
          tar -czvf bobby-linux-x86_64.tar.gz -C release_package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bobby-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
